<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css">
    
    <script defer src="./modals/drawable-object.class.js"></script>
    <script defer src="./modals/moveable-objects.class.js"></script>
    
    <script defer src="./modals/startscreen.class.js"></script>
    <script defer src="./modals/statusbar.class.js"></script>
    <script defer src="./modals/throwable-object.class.js"></script>
    <script defer src="./modals/character.class.js"></script>
    <script defer src="./modals/chicken.class.js"></script>
    <script defer src="./modals/endboss.class.js"></script>
    <script defer src="./modals/cloud.class.js"></script>
    <script defer src="./modals/background.class.js"></script>
    <script defer src="./modals/sky.class.js"></script>
    <script defer src="./modals/keyboard.class.js"></script>
    <script defer src="./modals/level.class.js"></script>
    <script defer src="./modals/coin.class.js"></script>
    <script defer src="./modals/bottle.class.js"></script>
    <script defer src="./modals/endscreen.class.js"></script>
    <script defer src="./modals/win.class.js"></script>
    <script defer src="./levels/level1.js"></script>
    <script defer src="./modals/world.class.js"></script>
    <script defer src="./js/game.js"></script>
    
</head>
<body onload="init()">
    <h1>El Pollo Loco</h1>

    <canvas id="canvas" width="720" height="480">
    </canvas>
    

    <div class="controlling-information">
        <h2>Controlling:</h2> 
        <article>
            <ul>
            <li>Arrow-Left: Character moves left.</li>
            <li>Arrow-Right: Character moves right.</li>
            <li>Space-bar: Character Jumps.</li>
            <li>Keyboard-key D: Character throws Salsa-bottle, if collected.</li>
            <li>Keyboard-key F: Fullscreen.</li>
            </ul>
        </article>
    </div>
    <div class="fullScreenContainer">
        <button class="fullscreen-btn" id="fullscreenBtn" onclick="setCanvasToFullscreen()">F</button>
    </div>
    <div id="mobileControllBtns" class="game-btn-container">
        <div>
            <button id="moveLeft"><-</button>
            <button id="moveRight">-></button>
            <button id="jump">jump</button>
        </div>
        <button id="throw">throw</button>
        
    </div>
</body>
</html>
